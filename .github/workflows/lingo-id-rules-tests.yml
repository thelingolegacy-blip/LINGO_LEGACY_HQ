name: Firestore Rules Tests

on:
  push:
    branches:
      - feature/lingo-account-registration
      - main
  pull_request:
    branches:
      - feature/lingo-account-registration
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rules:
    name: Run Firestore Security Rules Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rules Test Dependencies
        working-directory: 01_WEBSITES/account/rules-tests
        run: npm ci || npm install --no-audit --no-fund

      - name: Run Firestore Emulator Tests
        working-directory: 01_WEBSITES/account/rules-tests
        run: npm run test:rules
