name: Runner Route Probe — Alternate Hosted Fleet

on:
  push:
    branches:
      - main
      - 'edge/**'
  pull_request:
    branches:
      - main
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  alternate-runner-probe:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == 'RUNNER-DISPATCH-PROBE')
    runs-on: ubuntu-slim
    steps:
      - name: Runner dispatch sentinel
        shell: bash
        run: |
          echo "RUNNER_ROUTE_PROBE=STARTED"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "RUNNER_ROUTE_PROBE=EXECUTED"
