name: Runner Route Probe — Alternate Hosted Fleet

on:
  push:
    branches:
      - edge/cloudflare-appdeploy-bridge
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  alternate-runner-probe:
    runs-on: ubuntu-slim
    steps:
      - name: Runner dispatch sentinel
        shell: bash
        run: |
          echo "RUNNER_ROUTE_PROBE=STARTED"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "RUNNER_ROUTE_PROBE=EXECUTED"
