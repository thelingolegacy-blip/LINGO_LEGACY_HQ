name: Docker Disk & Build Stabilization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - 'compose.yaml'
      - 'compose.yml'
      - '.dockerignore'
      - 'ops/docker/**'
      - '.github/workflows/docker-disk-stabilization.yml'

permissions:
  contents: read

concurrency:
  group: docker-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-and-build:
    name: Inspect Docker, disk, and build cache
    # Hosted runners are currently failing before step initialization. Use explicit
    # self-hosted labels only if an online daemon is confirmed; do not disguise that gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Capture runner identity and pre-build disk/Docker state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence
          {
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner: $RUNNER_NAME"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner arch: $RUNNER_ARCH"
            echo
            df -hT
            df -ih
            docker version
            docker info
            docker system df -v
          } 2>&1 | tee .ci-evidence/docker-before.txt

      - name: Validate daemon sample and workflow metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool ops/docker/daemon.json.example >/dev/null
          test -n "$GITHUB_SHA"
          printf '{"run_id":"%s","run_attempt":"%s","commit":"%s","runner":"%s","workflow":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_WORKFLOW"             > .ci-evidence/correlation.json

      - name: Set up Buildx
        if: hashFiles('Dockerfile', '**/Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        if: hashFiles('Dockerfile', '**/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: lingo-legacy-ci:validation
          cache-from: type=gha,scope=lingo-docker-build
          cache-to: type=gha,scope=lingo-docker-build,mode=max
          provenance: false

      - name: Mark missing Dockerfile without failing diagnostics
        if: hashFiles('Dockerfile', '**/Dockerfile') == ''
        shell: bash
        run: echo "No Dockerfile found; completed Docker/disk diagnostics and skipped build."

      - name: Capture final Docker/disk state
        if: always()
        shell: bash
        run: |
          mkdir -p .ci-evidence
          {
            echo "UTC: $(date -u +%FT%TZ)"
            df -hT
            df -ih
            docker system df -v
          } > .ci-evidence/docker-after.txt 2>&1 || true
          # CI runner only: remove stale BuildKit cache, never volumes or images.
          docker builder prune --force --filter 'until=24h' || true

      - name: Upload correlated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-disk-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .ci-evidence/
          if-no-files-found: warn
          retention-days: 3
