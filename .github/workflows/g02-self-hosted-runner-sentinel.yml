name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: g02-runner-sentinel
  cancel-in-progress: false

jobs:
  g02-runner-sentinel:
    # Deliberately target the dedicated runner. Hosted runners cannot prove
    # the required self-hosted runner-registration and host-execution predicates.
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Runner identity and correlated execution evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'G02_EVIDENCE_SCHEMA=1\n'
          printf 'REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
          printf 'WORKFLOW=%s\n' "$GITHUB_WORKFLOW"
          printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
          printf 'RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
          printf 'JOB=%s\n' "$GITHUB_JOB"
          printf 'COMMIT=%s\n' "$GITHUB_SHA"
          printf 'REF=%s\n' "$GITHUB_REF"
          printf 'RUNNER_ID=%s\n' "$RUNNER_ID"
          printf 'RUNNER_NAME=%s\n' "$RUNNER_NAME"
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
          printf 'RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
          printf 'G02_SENTINEL=STARTED'
          test -n "$GITHUB_RUN_ID"
          test -n "$GITHUB_SHA"
          test -n "$RUNNER_ID"
          test "$RUNNER_ID" != "0"
          test -n "$RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          printf 'G02_SENTINEL=PASS\n'
          printf 'G02_EXIT=0\n'
      - name: Export evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## G02 Runner Sentinel'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Commit: $GITHUB_SHA"
            echo "- Job: $GITHUB_JOB"
            echo "- Runner ID: ${RUNNER_ID:-unavailable}"
            echo "- Runner name: ${RUNNER_NAME:-unavailable}"
            echo "- Runner OS/architecture: ${RUNNER_OS:-unavailable}/${RUNNER_ARCH:-unavailable}"
            echo
            echo 'A PASS requires a real assigned runner, successful sentinel step, retrievable logs, and independently correlated evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
