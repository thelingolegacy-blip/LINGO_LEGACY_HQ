name: G02 Self-Hosted Runner Sentinel

on:
  workflow_dispatch:
    inputs:
      incident_reference:
        description: "Incident or recovery ticket reference (for example, IR-06)"
        required: true
        type: string
      confirm_canary:
        description: "Confirm this is an isolated G02 canary, not a production deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: g02-runner-sentinel
  cancel-in-progress: false

jobs:
  g02-runner-sentinel:
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    env:
      INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
      CONFIRM_CANARY: ${{ inputs.confirm_canary }}
    steps:
      - name: Generate and validate correlated G02 evidence
        id: sentinel
        env:
          RUNNER_ID_FROM_CONTEXT: ${{ runner.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          evidence="runner-evidence/g02-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          {
            printf 'G02_EVIDENCE_SCHEMA=2\n'
            printf 'INCIDENT_REFERENCE=%s\n' "${INCIDENT_REFERENCE}"
            printf 'CONFIRM_CANARY=%s\n' "${CONFIRM_CANARY}"
            printf 'REPOSITORY=%s\n' "${GITHUB_REPOSITORY}"
            printf 'WORKFLOW=%s\n' "${GITHUB_WORKFLOW}"
            printf 'RUN_ID=%s\n' "${GITHUB_RUN_ID}"
            printf 'RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'JOB=%s\n' "${GITHUB_JOB}"
            printf 'COMMIT=%s\n' "${GITHUB_SHA}"
            printf 'REF=%s\n' "${GITHUB_REF}"
            printf 'RUNNER_ID=%s\n' "${RUNNER_ID_FROM_CONTEXT:-unavailable}"
            printf 'RUNNER_NAME=%s\n' "${RUNNER_NAME:-unavailable}"
            printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-unavailable}"
            printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-unavailable}"
            printf 'CAPTURED_AT_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$evidence"

          test -n "${INCIDENT_REFERENCE}"
          test "${CONFIRM_CANARY}" = "true"
          test -n "${GITHUB_RUN_ID}"
          test -n "${GITHUB_SHA}"
          test -n "${RUNNER_ID_FROM_CONTEXT:-}"
          test "${RUNNER_ID_FROM_CONTEXT}" != "0"
          test -n "${RUNNER_NAME:-}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

          printf 'G02_SENTINEL=PASS\n' | tee -a "$evidence"
          printf 'G02_EXIT=0\n' | tee -a "$evidence"

      - name: Preserve failure evidence and digest
        if: always()
        env:
          RUNNER_ID_FROM_CONTEXT: ${{ runner.id }}
        shell: bash
        run: |
          set -u
          mkdir -p runner-evidence
          evidence="runner-evidence/g02-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          if [ ! -f "$evidence" ]; then
            {
              printf 'G02_EVIDENCE_SCHEMA=2\n'
              printf 'INCIDENT_REFERENCE=%s\n' "${INCIDENT_REFERENCE:-unavailable}"
              printf 'REPOSITORY=%s\n' "${GITHUB_REPOSITORY:-unavailable}"
              printf 'RUN_ID=%s\n' "${GITHUB_RUN_ID:-unavailable}"
              printf 'RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT:-unavailable}"
              printf 'COMMIT=%s\n' "${GITHUB_SHA:-unavailable}"
              printf 'RUNNER_ID=%s\n' "${RUNNER_ID_FROM_CONTEXT:-unavailable}"
              printf 'RUNNER_NAME=%s\n' "${RUNNER_NAME:-unavailable}"
            } > "$evidence"
          fi
          if grep -q '^G02_SENTINEL=PASS$' "$evidence"; then
            printf 'SENTINEL_CHECKS=PASS\n' >> "$evidence"
          else
            printf 'SENTINEL_CHECKS=FAIL\n' >> "$evidence"
          fi
          sha256sum "$evidence" > runner-evidence/SHA256SUMS
          {
            echo '## G02 Runner Canary'
            echo
            echo "- Incident: ${INCIDENT_REFERENCE:-unavailable}"
            echo "- Run: ${GITHUB_RUN_ID:-unavailable} / attempt ${GITHUB_RUN_ATTEMPT:-unavailable}"
            echo "- Commit: ${GITHUB_SHA:-unavailable}"
            echo "- Runner ID: ${RUNNER_ID_FROM_CONTEXT:-unavailable}"
            echo "- Runner name: ${RUNNER_NAME:-unavailable}"
            echo "- Runner OS/architecture: ${RUNNER_OS:-unavailable}/${RUNNER_ARCH:-unavailable}"
            echo
            echo 'G02 PASS requires real runner assignment, successful sentinel checks, retrievable logs, and an independently verified correlated artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run-correlated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-runner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runner-evidence/g02-evidence-${{ github.run_id }}-${{ github.run_attempt }}.txt
            runner-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
