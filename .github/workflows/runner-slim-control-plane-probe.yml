name: Runner Slim Control Plane Probe
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  slim-control-plane-sentinel:
    runs-on: ubuntu-slim
    steps:
      - name: Execution sentinel
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "SLIM_CONTROL_PLANE_SENTINEL=true"
