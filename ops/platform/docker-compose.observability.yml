# Optional observability lab only. Never auto-started by CI.
# Requires a local, untracked .env with unique passwords before startup.
# Review image versions, RAM/storage, TLS, authentication, and retention first.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus","--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro","prometheus-data:/prometheus"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["metrics"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?Set local GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set local GRAFANA_ADMIN_PASSWORD}"
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on: [prometheus]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    profiles: ["logs"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?Set local ELASTIC_PASSWORD}"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    mem_limit: 2g
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.0
    profiles: ["logs"]
    depends_on: [elasticsearch]
    ports: ["127.0.0.1:5044:5044"]
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?Set local ELASTIC_PASSWORD}"
    volumes: ["./logstash/pipeline:/usr/share/logstash/pipeline:ro"]
    mem_limit: 1g
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    profiles: ["logs"]
    depends_on: [elasticsearch]
    ports: ["127.0.0.1:5601:5601"]
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "${KIBANA_SYSTEM_PASSWORD:?Set local KIBANA_SYSTEM_PASSWORD}"
    mem_limit: 1g
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
